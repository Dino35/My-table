<!DOCTYPE html>
<html>
<head>
    <title>Owner Dashboard - Gemini Eats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background-color: #2c3e50; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; color: #333; padding: 30px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        label { font-weight: bold; display: block; margin-top: 10px; color: #555; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 1em; }
        
        button { background: #e67e22; color: white; border: none; padding: 15px 25px; font-size: 1.1em; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 20px; transition: background 0.3s;}
        button:hover { background: #d35400; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        .item-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 15px 0; align-items: center;}
        .item-row:last-child { border-bottom: none; }
        .price { font-weight: bold; color: #27ae60; font-size: 1.1em; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .tiny-img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍💼 Owner Dashboard</h1>
    
    <div class="card">
        <h2>➕ Add New Menu Item</h2>
        
        <label>Dish Name</label>
        <input type="text" id="name" placeholder="e.g. Truffle Fries">
        
        <label>Price ($)</label>
        <input type="number" id="price" placeholder="12.50" step="0.01">
        
        <label>Description</label>
        <textarea id="desc" placeholder="e.g. Crispy fries with truffle oil..."></textarea>
        
        <label>Upload Image</label>
        <input type="file" id="img_file" accept="image/*">
        
        <button id="add-btn" onclick="addItem()">Add to Menu</button>
    </div>

    <div class="card">
        <h2>📜 Current Menu</h2>
        <div id="menu-preview">Loading...</div>
    </div>
</div>

<script>
    const RESTAURANT_ID = {{ restaurant_id }};
    const API_URL = `${window.location.protocol}//${window.location.host}/api`;

    async function addItem() {
        const btn = document.getElementById('add-btn');
        const name = document.getElementById('name').value;
        const price = document.getElementById('price').value;
        const desc = document.getElementById('desc').value;
        const fileInput = document.getElementById('img_file');

        if(!name || !price) return alert("Please fill in name and price");

        btn.innerText = "Uploading...";
        btn.disabled = true;

        let finalImageUrl = "https://placehold.co/100x100"; // Default if no image

        try {
            // 1. Upload Image (If selected)
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                const uploadRes = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!uploadRes.ok) throw new Error("Image upload failed");
                const uploadData = await uploadRes.json();
                finalImageUrl = uploadData.url; // Use the new local URL
            }

            // 2. Submit Menu Item
            const newItem = {
                "name": name,
                "price": parseFloat(price),
                "description": desc,
                "image_url": finalImageUrl
            };

            const response = await fetch(`${API_URL}/menu/${RESTAURANT_ID}/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
            });

            if (response.ok) {
                alert("✅ Item Added!");
                document.getElementById('name').value = "";
                document.getElementById('price').value = "";
                document.getElementById('desc').value = "";
                document.getElementById('img_file').value = "";
                loadMenu(); 
            } else {
                alert("Error adding item");
            }
        } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
        } finally {
            btn.innerText = "Add to Menu";
            btn.disabled = false;
        }
    }

    async function loadMenu() {
        try {
            const response = await fetch(`${API_URL}/menu/${RESTAURANT_ID}`);
            const data = await response.json();
            const list = document.getElementById('menu-preview');
            list.innerHTML = '';
            
            const menuItems = data.menu || [];
            if (menuItems.length === 0) list.innerHTML = "<p>No items yet.</p>";

            menuItems.forEach(item => {
                let img = item.image_url || "https://placehold.co/50";
                list.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <img src="${img}" class="tiny-img">
                            <div><strong>${item.name}</strong><div style="font-size:0.9em;color:#666">${item.description}</div></div>
                        </div>
                        <span class="price">$${item.price.toFixed(2)}</span>
                    </div>`;
            });
        } catch (e) { console.error(e); }
    }

    loadMenu();
</script>
</body>
</html>
